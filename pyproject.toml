[project]
name = "display-report"
# Version derives from git tags (hatch-vcs); flywheel cuts the tags.
dynamic = ["version"]
description = "Display measurement, analysis, and fidelity reporting"
authors = [{ name = "Unknown" }]
requires-python = ">=3.12,<3.15"
dependencies = [
    "bmd-signal-generator",
    "colour-science>=0.4.7,<0.5",
    "colour-datasets>=0.2.7,<0.3",
    "colour-specio",
    "numpy>=2.3.1,<3",
    "scipy>=1.10.1,<2",
    "xxhash>=3.2.0,<4",
    "matplotlib>=3.7.1,<4",
    "scikit-learn>=1.2.2,<2",
    "pandas>=3.0.5,<4",
    "opencv-python>=4.8.1.78,<5",
    "pymoo>=0.6.1.1,<0.7",
    "telnetlib3>=2.0.4,<3",
    "exscript>=2.6.28,<3",
    "questionary>=2.1.1",
]

[project.scripts]
display-report = "display_report.cli:main"

[dependency-groups]
dev = [
    "jupyter>=1.0.0,<2",
    "pytest>=9.1.1,<10",
    "pytest-xdist>=3.3.1,<4",
    "pyright>=1.1.332",
    "ruff>=0.1.0",
    "invoke>=2.2.0",
    "pre-commit>=4.2.0",
    "ipykernel>=7.3.0,<8",
    "networkx>=2.7,<3",
    "opencolorio>=2,<3",
    "tqdm>=4,<5",
]

[tool.uv.sources]
bmd-signal-generator = { git = "https://github.com/OpenDisplayEval/bmd-signal-gen.git", rev = "76c53490e535b10ef5a959384810780c14e1260e" }
# PyPI 0.4.2a0 declares requires-python >=3.13,<3.14 which blocks resolution
# on Python 3.14. The git commit relaxes it to >=3.12 and works fine on 3.14.
# Switch to a PyPI pin once upstream publishes a release with a broader bound.
colour-specio = { git = "https://github.com/colour-science/colour-specio.git", rev = "492e261e" }

[tool.uv]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["display_report"]

[tool.pyright]
include = ["display_report"]
pythonVersion = "3.14"
typeCheckingMode = "standard"
reportMissingImports = false
reportMissingModuleSource = false
reportUnboundVariable = false
reportUnnecessaryCast = true
reportUnnecessaryTypeIgnoreComment = true
reportUnsupportedDunderAll = false
reportUnusedExpression = false
reportUnusedImport = true
reportUnusedVariable = true
reportMissingParameterType = true
reportDuplicateImport = true
reportInconsistentConstructor = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-n auto --dist=loadscope --durations=5"
filterwarnings = [
    "ignore::RuntimeWarning",
    "ignore::pytest.PytestCollectionWarning",
    "ignore::colour.utilities.ColourWarning",
    "ignore::colour.utilities.ColourRuntimeWarning",
    "ignore::colour.utilities.ColourUsageWarning",
    "ignore:Implicit None on return values is deprecated:DeprecationWarning",
    "ignore:Jupyter is migrating its paths:DeprecationWarning",
    "ignore:the imp module is deprecated:DeprecationWarning",
    "ignore:Method Nelder-Mead does not use gradient information:RuntimeWarning",
    "ignore:More than 20 figures have been opened:RuntimeWarning",
    "ignore:divide by zero encountered:RuntimeWarning",
    "ignore:invalid value encountered in:RuntimeWarning",
    "ignore:overflow encountered in:RuntimeWarning",
    "ignore:Matplotlib is currently using agg:UserWarning",
    "ignore:override the edgecolor or facecolor properties:UserWarning",
]

[tool.ruff]
target-version = "py314"
line-length = 88
exclude = []

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "C90", # mccabe complexity
    "T20", # flake8-print
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "RUF", # Ruff-specific rules
]
ignore = [
    "E501", # Line too long (handled by formatter)
    "B008", # Do not perform function calls in argument defaults
]
typing-modules = ["colour.hints"]

[tool.ruff.lint.isort]
known-first-party = ["display_report"]
split-on-trailing-comma = true

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG", "T20"]
"tasks.py" = ["T20"]
"display_report/cli.py" = ["T201"]
"display_report/scripts/*" = ["T201"]
"display_report/device_info.py" = ["T201"]
"display_report/fonts/__init__.py" = ["F403"]
"*.ipynb" = ["E402"]

[tool.ruff.format]
docstring-code-format = true

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/streetsidesoftware/cspell-cli
    rev: v10.4.1
    hooks:
      - id: cspell
        # The current LTS line, as the spellcheck job runs. Left to choose,
        # pre-commit's nodeenv takes the newest Node listing, which can be a
        # prerelease whose version it fails to parse.
        language_version: lts
        args: [--no-progress]
        files: \.(py|md)$
        exclude: ^(colour-science|colour-datasets|colour-specio|\.venv|__pycache__|build|dist)/
  - repo: local
    hooks:
      - id: user-pre-commit-hook
        name: user pre-commit hook
        language: system
        entry: sh -c 'HOOK="${XDG_CONFIG_HOME:-$HOME/.config}/git/hooks/pre-commit"; test -x "$HOOK" && exec "$HOOK" || true'
        always_run: true
        pass_filenames: false
